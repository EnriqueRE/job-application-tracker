{% macro field(name, label, values, errors, type="text", required=false) -%}
<div class="field">
  <label for="{{ name }}">{{ label }}{% if required %} *{% endif %}</label>
  {% if type == "textarea" %}
  <textarea id="{{ name }}" name="{{ name }}" rows="{{ 12 if name == 'job_description' else 4 }}"
    {% if errors.get(name) %}aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}>{{ values.get(name) or "" }}</textarea>
  {% else %}
  <input id="{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ values.get(name) or '' }}"
    {% if required %}required{% endif %}
    {% if errors.get(name) %}aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}>
  {% endif %}
  {% if errors.get(name) %}<p class="error" id="{{ name }}-error">{{ errors[name] }}</p>{% endif %}
</div>
{%- endmacro %}
